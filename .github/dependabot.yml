version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-server)"
    groups:
      server-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors hors périmètre du projet : migration à planifier séparément
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Types alignés sur le runtime Node 24 (.nvmrc)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-client)"
    groups:
      client-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Majors hors périmètre du projet : migration à planifier séparément
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # vite et son plugin évoluent ensemble (plugin-react 6 exige un Vite plus récent)
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react 7.37 n'accepte pas ESLint 10 (peerDependency) : on attend son support
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker-server)"
    groups:
      docker-server-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Runtime aligné sur Node 24 (.nvmrc, CI)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker-client)"
    groups:
      docker-client-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Build Vite aligné sur Node 24 (.nvmrc, CI)
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
