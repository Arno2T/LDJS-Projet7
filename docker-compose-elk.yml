# Local log stack (never in CI):
#   docker compose -f docker-compose-elk.yml --env-file elk/elk.env up -d
# Security disabled ON PURPOSE for local use only: ports bound to 127.0.0.1, see README.

name: orion-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    mem_limit: 2g            # heap 1g + off-heap (Lucene, threads)
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks: [elk]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.25
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - XPACK_MONITORING_ENABLED=false
    mem_limit: 1g
    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
    networks: [elk]          # 5044 reachable by filebeat only, not published
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.25
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 1g
    ports:
      - "127.0.0.1:5601:5601"
    networks: [elk]
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.25
    user: root               # container log files are root-owned (0640)
    # strict.perms=false: filebeat.yml is bind-mounted from the host (owned by uid 1000), mounted read-only
    command: ["filebeat", "-e", "--strict.perms=false"]
    mem_limit: 256m
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${DOCKER_CONTAINERS_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro   # RISK: see security plan
      - filebeat-data:/usr/share/filebeat/data   # registry = read positions (at-least-once)
    networks: [elk]
    depends_on:
      logstash:
        condition: service_healthy
    restart: unless-stopped

volumes:
  es-data:
  filebeat-data:

networks:
  elk:
