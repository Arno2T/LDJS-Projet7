input {
  beats {
    port => 5044
  }
}

filter {
  if [message] =~ /^\{/ {
    # pino line: fields at the root (level, msg, req, res, responseTime, err, service)
    json {
      source => "message"
      skip_on_invalid_json => true
      remove_field => ["message"]      # only applied if parsing succeeds
    }
    mutate { rename => { "msg" => "message" } }
    date {
      match => ["time", "ISO8601"]
      remove_field => ["time"]
    }
  } else if ![level] {
    # text lines (nginx, prisma migrate): level from the stream
    if [stream] == "stderr" {
      mutate { add_field => { "level" => "warn" } }
    } else {
      mutate { add_field => { "level" => "info" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orion-logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
